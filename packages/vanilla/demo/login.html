<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Password2D Vanilla</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-lg">
        <h1 class="text-2xl font-bold mb-6 text-gray-800">Login</h1>

        <div class="mb-6">
            <label class="block text-sm font-medium text-gray-700 mb-2">Email Address</label>
            <input type="email" id="email-input"
                class="w-full p-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-cyan-500"
                placeholder="you@example.com">
        </div>

        <div class="mb-8">
            <label class="block text-sm font-medium text-gray-700 mb-2">Password</label>
            <div id="login-grid"></div>
        </div>

        <div id="status-msg" class="hidden mb-4 p-3 rounded text-sm"></div>

        <button id="login-btn"
            class="w-full py-3 px-4 bg-cyan-600 text-white rounded hover:bg-cyan-700 transition font-medium">
            Login
        </button>

        <div class="mt-4 text-center">
            <a href="index.html" class="text-sm text-gray-500 hover:underline">Back to Home</a>
        </div>
    </div>

    <script src="../dist/index.global.js"></script>
    <script>
        const Password2DGrid = window.Password2D.Password2D;

        const emailInput = document.getElementById('email-input');
        const loginContainer = document.getElementById('login-grid');
        const loginBtn = document.getElementById('login-btn');
        const statusMsg = document.getElementById('status-msg');

        const loginGrid = new Password2DGrid(loginContainer, {
            rows: 2,
            cols: 4,
            showText: "Show",
            hideText: "Hide"
        });

        // Pre-fill email from URL
        const params = new URLSearchParams(window.location.search);
        if (params.has('email')) {
            emailInput.value = params.get('email');
        }

        loginBtn.addEventListener('click', () => {
            const email = emailInput.value.trim();
            const input = loginGrid.value;

            if (!email) {
                showStatus("Email is required", false);
                return;
            }

            let stored = null;
            try {
                stored = localStorage.getItem('user_' + email);
            } catch (e) {
                console.warn('localStorage not available', e);
            }

            if (!stored) {
                showStatus("No user found with this email.", false);
                return;
            }

            if (input === stored) {
                showStatus("Login Successful!", true);
            } else {
                showStatus("Incorrect Password", false);
            }
        });

        function showStatus(msg, success) {
            statusMsg.textContent = msg;
            statusMsg.classList.remove('hidden', 'bg-red-100', 'text-red-700', 'bg-green-100', 'text-green-700');

            if (success) {
                statusMsg.classList.add('bg-green-100', 'text-green-700');
            } else {
                statusMsg.classList.add('bg-red-100', 'text-red-700');
            }
        }
    </script>
</body>

</html>
